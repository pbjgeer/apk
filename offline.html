<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline | PB Jgeer</title>
<meta name="theme-color" content="#7A1020">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<style>
  :root{--ink:#2B1B22;--mut:#85727B;--bg:#FFF8F5;--rose:#E4405F;--grad:linear-gradient(135deg,#E4405F,#FF7A59)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:radial-gradient(40rem 30rem at 85% 0%,rgba(255,122,89,.28),transparent 65%),radial-gradient(40rem 30rem at 0% 100%,rgba(228,64,95,.18),transparent 65%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-align:center}
  .card{max-width:24rem;background:#fff;border:1px solid rgba(43,27,34,.09);border-radius:1.75rem;padding:2rem 1.5rem;box-shadow:0 1px 2px rgba(43,27,34,.05),0 14px 34px -16px rgba(214,69,93,.35)}
  img{width:88px;height:88px;border-radius:50%}
  h1{margin:1rem 0 .4rem;font-size:1.4rem}
  p{margin:0 0 1.25rem;color:var(--mut);line-height:1.55}
  a,button{display:inline-block;border:0;border-radius:999px;padding:.75rem 1.5rem;font:700 .95rem system-ui,sans-serif;color:#fff;background:var(--grad);text-decoration:none;cursor:pointer;box-shadow:0 14px 24px -14px rgba(228,64,95,.9)}
  .sub{display:block;margin-top:.9rem;background:none;box-shadow:none;color:var(--rose);padding:.4rem}
</style>
</head>
<body>
  <main class="card">
    <img src="icons/icon-192.png" alt="PB Jgeer">
    <h1>Kamu sedang offline</h1>
    <p>Halaman ini belum pernah dibuka di HP ini, jadi belum tersimpan. Sambungkan internet lalu coba lagi.</p>
    <button onclick="location.reload()">Coba lagi</button>
    <a class="sub" href="index.html">Ke Beranda</a>
  </main>
</body>
</html>
